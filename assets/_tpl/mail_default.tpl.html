<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>{site_name}</title>
</head>
<body style="margin:0;padding:0;background-color:#eef2f7;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#eef2f7;">
	<tr>
		<td align="center" style="padding:24px 12px;">
			<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="640"
			       style="width:100%;max-width:640px;background:#ffffff;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;">
				<tr>
					<td style="padding:24px;background:#030041;text-align:center;">
						<img src="{logo_header}" alt="{site_name} - logo"
						     style="max-width:220px;height:100px;width:auto;display:inline-block;">
					</td>
				</tr>
				<tr>
					<td style="padding:24px;font-family:Verdana,Arial,Helvetica,sans-serif;font-size:14px;line-height:1.6;color:#111827;">
						#mail_body#
					</td>
				</tr>
				<tr>
					<td style="padding:0 24px 20px 24px;font-family:Verdana,Arial,Helvetica,sans-serif;font-size:13px;line-height:1.6;color:#334155;">

						<img src="{logo_mail}" alt="{site_name} - logo"
						     style="max-width:160px;height:64px;width:auto;display:inline-block;">

						{signature_block}
					</td>
				</tr>
				<tr>
					<td style="padding:0 24px 20px 24px;">
						<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
						       style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;">
							<tr>
								<td style="padding:14px 16px 8px 16px;font-family:Verdana,Arial,Helvetica,sans-serif;font-size:13px;color:#334155;">
									Siga-nos nas redes sociais:
								</td>
							</tr>
							<tr>
								<td style="padding:0 16px 12px 16px;">
									{social_links}
								</td>
							</tr>
							<tr>
								<td style="padding:0 16px 16px 16px;font-family:Verdana,Arial,Helvetica,sans-serif;font-size:13px;color:#475569;">
									Visite nosso portal:
									<a href="{base_url}" style="color:#0b5ed7;text-decoration:none;" target="_blank"
									   rel="noopener noreferrer">{base_url}</a>
								</td>
							</tr>
						</table>
					</td>
				</tr>
				<tr>
					<td style="padding:0 24px 24px 24px;font-family:Verdana,Arial,Helvetica,sans-serif;font-size:11px;line-height:1.4;color:#64748b;text-align:center;">
						Antes de imprimir, pense na sua responsabilidade com o meio ambiente.
					</td>
				</tr>
			</table>
		</td>
	</tr>
</table>
</body>
</html>
